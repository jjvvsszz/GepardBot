<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <title>Gepard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Configuracao - Gepard Bot</h3>
            <div>
                <a href="/admin/users" class="btn btn-outline-light btn-sm me-2">
                    Usuarios <span class="badge bg-light text-dark" th:text="${userCount}"></span>
                </a>
                <a href="/admin/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
        <div class="card-body">

            <div th:if="${message}" class="alert alert-warning" role="alert">
                <span th:text="${message}"></span>
            </div>

            <form action="/admin/save" method="post">
                <h5 class="mb-3">Telegram Bot</h5>
                <div class="mb-3">
                    <label for="telegramBotUsername" class="form-label">Bot Username</label>
                    <input type="text" id="telegramBotUsername" name="telegramBotUsername" class="form-control" th:value="${config.telegramBotUsername}">
                </div>
                <div class="mb-3">
                    <label for="telegramBotToken" class="form-label">Bot Token (BotFather)</label>
                    <input type="password" id="telegramBotToken" name="telegramBotToken" class="form-control" th:value="${config.telegramBotToken}">
                </div>

                <hr>

                <h5 class="mb-3">Google OAuth2 (Calendar)</h5>
                <div class="mb-3">
                    <label for="googleClientId" class="form-label">Client ID</label>
                    <input type="text" id="googleClientId" name="googleClientId" class="form-control" th:value="${config.googleClientId}">
                </div>
                <div class="mb-3">
                    <label for="googleClientSecret" class="form-label">Client Secret</label>
                    <input type="password" id="googleClientSecret" name="googleClientSecret" class="form-control" th:value="${config.googleClientSecret}">
                </div>

                <hr>

                <h5 class="mb-3">IA (Modelo Padrao do Sistema)</h5>
                <div class="mb-3">
                    <label for="geminiModel" class="form-label">Modelo Padrao</label>
                    <select id="geminiModel" name="geminiModel" class="form-select">
                        <option th:each="m : ${availableModels}"
                                th:value="${m}"
                                th:text="${m}"
                                th:selected="${m == config.geminiModel}">
                        </option>
                    </select>
                    <div class="form-text mt-2">
                        DeepSeek: apenas para texto. Gemini: texto, foto e audio.
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100">Salvar Alteracoes</button>
                <small class="text-muted d-block mt-2 text-center">* Ao alterar IDs OAuth ou Client Secret, reinicie a aplicacao.</small>
            </form>
        </div>
    </div>
</div>
</body>
</html>
