<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <title>Usuarios - Gepard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Usuarios <span class="badge bg-light text-dark" th:text="${count}"></span></h3>
            <div>
                <a href="/admin" class="btn btn-outline-light btn-sm me-2">Painel</a>
                <a href="/admin/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${users.isEmpty()}">
                <p class="text-muted text-center">Nenhum usuario cadastrado ainda.</p>
            </div>

            <table class="table table-striped" th:if="${!users.isEmpty()}">
                <thead>
                    <tr>
                        <th>Telegram ID</th>
                        <th>Nome</th>
                        <th>Username</th>
                        <th>API Gemini</th>
                        <th>API DeepSeek</th>
                        <th>Google</th>
                        <th>Modelo Texto</th>
                        <th>Modelo Arquivo</th>
                        <th>Criado em</th>
                        <th>Ativo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.telegramId}"></td>
                        <td th:text="${u.firstName}"></td>
                        <td th:text="${u.username} ?: '-'"></td>
                        <td>
                            <span class="badge bg-success" th:if="${u.hasGeminiKey()}">Sim</span>
                            <span class="badge bg-secondary" th:unless="${u.hasGeminiKey()}">Nao</span>
                        </td>
                        <td>
                            <span class="badge bg-success" th:if="${u.hasDeepSeekKey()}">Sim</span>
                            <span class="badge bg-secondary" th:unless="${u.hasDeepSeekKey()}">Nao</span>
                        </td>
                        <td>
                            <span class="badge bg-success" th:if="${u.isGoogleConnected()}">Sim</span>
                            <span class="badge bg-secondary" th:unless="${u.isGoogleConnected()}">Nao</span>
                        </td>
                        <td th:text="${u.preferredTextModel} ?: '-'"></td>
                        <td th:text="${u.preferredFileModel} ?: '-'"></td>
                        <td th:text="${u.createdAt} ? ${#temporals.format(u.createdAt, 'dd/MM HH:mm')} : '-'"></td>
                        <td th:text="${u.updatedAt} ? ${#temporals.format(u.updatedAt, 'dd/MM HH:mm')} : '-'"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
