<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <title>Erro - Gepard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card p-4 shadow-lg text-center" style="max-width: 500px;">
    <h1 class="text-danger mb-3">Ops!</h1>
    <p class="lead" th:text="${errorMessage}">Ocorreu um erro inesperado.</p>
    <p class="text-muted">Volte ao Telegram e digite /config para tentar novamente.</p>
    <a href="https://t.me/gepardbot" class="btn btn-primary">Voltar ao Telegram</a>
</div>
</body>
</html>
